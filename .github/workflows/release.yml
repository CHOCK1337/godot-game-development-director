name: Build or publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing immutable semantic version tag, for example v0.1.0-alpha.1"
        required: true
        default: "v0.1.0-alpha.1"
      publish:
        description: "Create a new GitHub Release after validation"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GODOT_ARCHIVE: Godot_v4.6.3-stable_linux.x86_64.zip
  GODOT_SHA256: d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3
  GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Download verified Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$GODOT_ARCHIVE" "$GODOT_URL"
          echo "$GODOT_SHA256  $GODOT_ARCHIVE" | sha256sum --check -
          unzip -q "$GODOT_ARCHIVE"
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Validate repository
        run: |
          python scripts/validate_public_release.py
          python tests/validate_package.py
          python -m unittest discover -s tests -v
          python scripts/run_godot_validation.py --godot ./Godot_v4.6.3-stable_linux.x86_64

      - name: Build release assets
        run: python scripts/build_release.py --version "${{ inputs.version }}" --clean

      - name: Attest release archive
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: "dist/*.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godot-game-development-director-${{ inputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create immutable GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          asset="dist/godot-game-development-director-${VERSION}.zip"
          prerelease=()
          case "$VERSION" in
            *-alpha*|*-beta*|*-rc*) prerelease+=(--prerelease) ;;
          esac

          if ! tag_commit="$(git rev-parse "${VERSION}^{commit}")"; then
            echo "Tag $VERSION does not exist. Create and review the tag before publishing." >&2
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Tag $VERSION points to $tag_commit, but this run validates $head_commit." >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Refusing to replace existing release $VERSION." >&2
            exit 1
          fi

          gh release create "$VERSION" "$asset" dist/SHA256SUMS \
            --verify-tag \
            --title "Godot Game Development Director $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --latest=false \
            "${prerelease[@]}"
