name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_ARCHIVE: Godot_v4.6.3-stable_linux.x86_64.zip
  GODOT_SHA256: d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3
  GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Download verified Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$GODOT_ARCHIVE" "$GODOT_URL"
          echo "$GODOT_SHA256  $GODOT_ARCHIVE" | sha256sum --check -
          unzip -q "$GODOT_ARCHIVE"
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Validate public release structure
        run: python scripts/validate_public_release.py

      - name: Validate package contract
        run: python tests/validate_package.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile and smoke-test shipped GDScript
        run: python scripts/run_godot_validation.py --godot ./Godot_v4.6.3-stable_linux.x86_64

      - name: Build and verify test release asset
        run: |
          python scripts/build_release.py --version v0.0.0-ci --output release-build --clean
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive = next(Path("release-build").glob("*.zip"))
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"CRC failure: {bad}")
          print(archive)
          PY
