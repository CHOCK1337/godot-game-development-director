name: Bug report
description: Report a reproducible package, routing, validator, or documentation problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private project files, or unlicensed assets."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0-alpha.1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the task prompt, selected specialists, commands, and minimal public inputs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, Godot, OS, Codex/runtime, and relevant versions.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact paths, tokens, player data, and private content.
