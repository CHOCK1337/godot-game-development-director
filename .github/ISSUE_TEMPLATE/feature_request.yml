name: Feature request
description: Propose a scoped Skill, Agent, validator, adapter, or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the observable failure or missing capability.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful change and its boundaries.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and references
      description: Add official documentation, research, or reproducible examples.
  - type: textarea
    id: tests
    attributes:
      label: Suggested evaluations
      description: What should fail before the change and pass afterward?
